version: 2
updates:
  # Kokoro app base image and pinned pip packages. A Dependabot PR only bumps the
  # pin: also bump version in config.yaml and add a CHANGELOG entry
  # in the same PR, or Home Assistant won't offer the update.
  - package-ecosystem: docker
    directory: /kokoro_wyoming
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /kokoro_wyoming
    schedule:
      interval: weekly
